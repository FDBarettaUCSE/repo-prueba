# Levanta el stack: MongoDB + la API de Gestock.
#
#   docker compose up --build   # construye la imagen de la API y levanta todo
#   docker compose down         # para y borra los contenedores (el volumen queda)
#   docker compose down -v      # además borra el volumen (pierde los datos)
#
# Ver api/cmd/api/main.go para el detalle completo de cómo se arma la imagen
# de Docker y las distintas formas de correr esto.
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - datos-depositos:/data/db

  api:
    build: ./api
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: "mongodb://mongo:27017"
      JWT_SECRET: "${JWT_SECRET:?falta JWT_SECRET: copiá .env.example a .env y completalo}"
      INITIAL_ADMIN_EMAIL: "${INITIAL_ADMIN_EMAIL:-}"
      INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD:-}"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:8080}"
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  datos-depositos:
